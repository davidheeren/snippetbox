{{define "snippets"}}
    {{if .Snippets}}
    <table>
        <tr>
            <th>Title</th>
            <th>Created</th>
            <th>Author</th>
        </tr>
        {{range .Snippets}}
        <tr>
            <td><a href="/snippets/view/{{.ID}}">{{.Title}}</a></td>
            <td><time>{{iso .CreatedAt}}</time></td>
            <td>{{.UserName}}</td>
        </tr>
        {{end}}
    </table>
    {{else}}
        <p>No snippets match the search</p>
    {{end}}
{{end}}
