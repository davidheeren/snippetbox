{{define "title"}}Home{{end}}

{{define "main"}}
<h1>Welcome {{.AuthUser.Name}}!</h1>
<h2>Latest Snippets</h2>
    {{if .Snippets}}
    <table>
        <tr>
            <th>Title</th>
            <th>Created</th>
            <th>Author</th>
        </tr>
        {{range .Snippets}}
        <tr>
            <td><a href="/snippets/view/{{.ID}}">{{.Title}}</a></td>
            <td><time>{{iso .CreatedAt}}<time></td>
            <td>{{.UserName}}</td>
        </tr>
        {{end}}
    </table>
    {{else}}
        <p>There's nothing to see here yet!</p>
    {{end}}
{{end}}
