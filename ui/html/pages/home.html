{{define "title"}}Home{{end}}

{{define "main"}}
<h1>Welcome {{.AuthUser.Name}}{{if .AuthUser.IsAdmin}} (Admin){{end}}!</h1>
<h2>Latest Snippets</h2>
    <form class="contents" hx-get="/snippets/search"
        hx-trigger="input changed delay:500ms, submit"
        hx-target="#snippets"
        hx-push-url="true">
        <input type="search" name="query"
        value="{{.Query}}" placeholder="Begin Typing To Search By Title...">
    </form>
    <div id="snippets">
    {{template "snippets" .}}
    </div>
{{end}}
