{{define "title"}}Snippet #{{.Snippet.ID}}{{end}}

{{define "main"}}
    {{with .Snippet}}
    <div class="snippet">
        <div class="metadata">
            <strong>{{.Title}}</strong>
            <span>#{{.ID}}</span>
        </div>
        <pre><code>{{.Content}}</code></pre>
        <div class="metadata">
            <span>Created: <time>{{iso .CreatedAt}}</time></span>
            <span>Expires: <time>{{iso .ExpiresAt}}</time></span>
        </div>
        <div class="metadata">
            <button class="delete" hx-delete="/snippets/{{.ID}}" hx-confirm="Delete this snippet?" hx-target="closest .snippet">
                Delete snippet
            </button>
        </div>
    </div>
    {{end}}
{{end}}
