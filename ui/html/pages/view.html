{{define "title"}}Snippet #{{.Snippet.ID}}{{end}}

{{define "main"}}
    <div class="snippet">
        <div class="metadata">
            <strong>{{.Snippet.Title}}</strong>
            <span>Author: {{.Snippet.UserName}}</span>
        </div>
        <pre><code>{{.Snippet.Content}}</code></pre>
        <div class="metadata">
            <span>Created: <time>{{iso .Snippet.CreatedAt}}</time></span>
            <span>Expires: <time>{{iso .Snippet.ExpiresAt}}</time></span>
        </div>
        <div class="metadata">
            {{if or .AuthUser.IsAdmin (eq .AuthUser.ID .Snippet.UserID)}}
            <button class="delete" hx-delete="/snippets/{{.Snippet.ID}}" hx-confirm="Delete this snippet?" hx-target="closest .snippet">
                Delete snippet
            </button>
            {{end}}
        </div>
    </div>
{{end}}
